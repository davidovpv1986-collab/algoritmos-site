# Статический фронтенд. Подключите сертификат Let's Encrypt / свой TLS.
# root — каталог frontend/out после npm run build.

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name algorithmos.ru www.algorithmos.ru;

  # ssl_certificate     /etc/letsencrypt/live/algorithmos.ru/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/algorithmos.ru/privkey.pem;

  root /var/www/algorithmos/frontend/out;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru; font-src 'self'; connect-src 'self' https://api.algorithmos.ru https://mc.yandex.ru https://mc.yandex.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  location ~* \.(js|css|woff2|svg|png|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name algorithmos.ru www.algorithmos.ru;
  return 301 https://$host$request_uri;
}
