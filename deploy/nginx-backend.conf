# API заявок. Процесс Node слушает 127.0.0.1:4000 (HOST=127.0.0.1, TRUST_PROXY=true).

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name api.algorithmos.ru;

  # ssl_certificate     /etc/letsencrypt/live/api.algorithmos.ru/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/api.algorithmos.ru/privkey.pem;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  client_max_body_size 16k;

  location / {
    proxy_pass http://127.0.0.1:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Powered-By;
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name api.algorithmos.ru;
  return 301 https://$host$request_uri;
}
