name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (статический экспорт)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Установка зависимостей
        run: npm ci
        working-directory: frontend

      - name: Проверка типов
        run: npm run typecheck
        working-directory: frontend

      - name: Сборка статического сайта
        run: npm run build
        working-directory: frontend

      - name: Загрузка артефакта out/
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out
          retention-days: 7

  backend:
    name: Backend (API заявок)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Установка зависимостей
        run: npm ci
        working-directory: backend

      - name: Проверка типов
        run: npm run typecheck
        working-directory: backend

      - name: Компиляция TypeScript
        run: npm run build
        working-directory: backend

      - name: Smoke-тест health-check и приёма заявки (резервный режим без SMTP)
        run: |
          PORT=4100 node dist/index.js &
          sleep 2
          curl -fsS http://localhost:4100/api/health | grep '"status":"ok"'
          curl -fsS -X POST http://localhost:4100/api/leads \
            -H "Content-Type: application/json" \
            -d '{"name":"CI Тест","email":"ci@test.dev","message":"Проверка приёма заявок"}' \
            | grep '"ok":true'
          grep '"email":"ci@test.dev"' data/leads.jsonl
        working-directory: backend
